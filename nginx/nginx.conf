# ==============================================================================
# Lumina 24-Hour Cafe - High-Performance Enterprise Reverse Proxy & Layer 7 Load Balancer
# Architecture: 8 Node.js Cluster Nodes, SSE Streaming, WebSocket, Static Caching
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning & Zero-Copy Socket Delivery
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression Tuning
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Anti-DDoS Rate Limiting Zones (Token Bucket Algorithm)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=bot_burst:10m rate=120r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # Upstream Multi-Node Cluster (8 Backend App Instances)
    upstream lumina_app_cluster {
        least_conn; # Route traffic to instance with lowest active connections
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3003 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3004 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3005 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3006 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3007 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Honeypot Bot Trap Route (Silently quarantine scrapers)
        location = /api/v1/bot-trap {
            proxy_pass http://lumina_app_cluster;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            access_log /var/log/nginx/honeypot_bots.log;
        }

        # Real-Time SSE Stream (Zero Buffering for Instant Table Updates)
        location /api/v1/stream {
            proxy_pass http://lumina_app_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Critical SSE proxy tuning
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # High-Speed REST API Routes
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            limit_conn addr_limit 50;

            proxy_pass http://lumina_app_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # Frontend SPA & Static Assets
        location / {
            proxy_pass http://lumina_app_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
