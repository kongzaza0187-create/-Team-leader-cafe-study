# ==============================================================================
# Lumina 24-Hour Cafe - High-Performance Redis Cluster Configuration
# Optimized for 50,000 Concurrent Mobile Connections
# Memory Policy: volatile-lru | Cluster Sharding: 6 Master Nodes + 6 Replicas
# ==============================================================================

port 6379
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
appendonly yes
appendfsync everysec

# Max Memory & Eviction Strategy
maxmemory 16gb
maxmemory-policy volatile-lru
maxmemory-samples 10

# TCP Socket Tuning for 50k Concurrency
tcp-backlog 65536
timeout 300
tcp-keepalive 60

# Distributed Locks & Session Expirations
# Keys:
# lumina:table:{table_id}:lock -> TTL 10s (Redlock distributed mutual exclusion)
# lumina:session:{session_id}   -> TTL 86400s (24h sliding window)
# lumina:secret_code:{table_id} -> Current active 6-digit code
# lumina:cart:{session_id}      -> Real-time Cart state on server
