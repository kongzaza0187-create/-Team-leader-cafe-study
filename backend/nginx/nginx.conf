# ==============================================================================
# Lumina 24-Hour Study & Coffee Cafe Platform
# High-Concurrency Nginx Reverse Proxy & Load Balancer Configuration
# Handles 50,000+ Concurrent Mobile Users with sub-10ms SSE Proxying
# Multi-Node Node.js Cluster Upstream (Instances: Node-01 to Node-04)
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 100000;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 25000;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning for High-Concurrency I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    reset_timedout_connection on;
    client_body_timeout 10;
    send_timeout 10;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Upstream Node.js Cluster (4 Micro-Service Worker Nodes)
    upstream lumina_node_cluster {
        least_conn; # Least-connections load balancing for equal distribution
        server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3003 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3004 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    # Micro-Cache for Static Assets
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=STATIC_CACHE:10m max_size=1g inactive=60m use_temp_path=off;

    server {
        listen 80;
        listen [::]:80;
        server_name cafe.lumina24h.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name cafe.lumina24h.com;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/cafe.lumina24h.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cafe.lumina24h.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Static Assets with Cloudflare Edge Caching Headers
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://lumina_node_cluster;
            proxy_cache STATIC_CACHE;
            proxy_cache_valid 200 302 7d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # REAL-TIME SSE (Server-Sent Events) Stream Proxy
        # Crucial: proxy_buffering off & keepalive for sub-10ms table updates
        location /api/v1/stream {
            proxy_pass http://lumina_node_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Disable buffering for instantaneous real-time dispatch
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            chunked_transfer_encoding off;
        }

        # WebSocket Upgrade Support
        location /ws {
            proxy_pass http://lumina_node_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Default Proxy Route
        location / {
            proxy_pass http://lumina_node_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
