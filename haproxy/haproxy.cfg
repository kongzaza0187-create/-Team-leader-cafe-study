# ==============================================================================
# Lumina 24-Hour Cafe - High-Availability Layer 4 TCP / Layer 7 Load Balancer
# Supports 50,000 Concurrent Connections with Sub-Millisecond Round-Robin Dispatch
# ==============================================================================

global
    log stdout format raw local0 info
    maxconn 65535
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    timeout tunnel  86400s # Keep SSE connections alive for 24 hours

# Frontend Entrypoint
frontend http_front
    bind *:80
    mode http
    
    # Track request rates per client IP
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    
    # Silent Rate Limiting (Drop or 429 if > 150 req/10s)
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 150 }

    # Route SSE requests specifically with no-timeout policy
    acl is_sse path_beg /api/v1/stream
    use_backend sse_cluster if is_sse

    default_backend app_cluster

# Backend Cluster: Standard API & Web Traffic (Least Connections)
backend app_cluster
    mode http
    balance leastconn
    option httpchk GET /api/v1/health
    http-check expect status 200
    cookie LUMINA_SRV insert indirect nocache

    server node1 127.0.0.1:3000 check inter 2000ms rise 2 fall 3 cookie s1
    server node2 127.0.0.1:3001 check inter 2000ms rise 2 fall 3 cookie s2
    server node3 127.0.0.1:3002 check inter 2000ms rise 2 fall 3 cookie s3
    server node4 127.0.0.1:3003 check inter 2000ms rise 2 fall 3 cookie s4
    server node5 127.0.0.1:3004 check inter 2000ms rise 2 fall 3 cookie s5
    server node6 127.0.0.1:3005 check inter 2000ms rise 2 fall 3 cookie s6
    server node7 127.0.0.1:3006 check inter 2000ms rise 2 fall 3 cookie s7
    server node8 127.0.0.1:3007 check inter 2000ms rise 2 fall 3 cookie s8

# Backend Cluster: Real-Time SSE Event Stream (Zero Buffer / Keep-Alive)
backend sse_cluster
    mode http
    balance roundrobin
    timeout server 86400s
    option httpchk GET /api/v1/health
    http-check expect status 200

    server node1_sse 127.0.0.1:3000 check inter 3000ms
    server node2_sse 127.0.0.1:3001 check inter 3000ms
    server node3_sse 127.0.0.1:3002 check inter 3000ms
    server node4_sse 127.0.0.1:3003 check inter 3000ms
    server node5_sse 127.0.0.1:3004 check inter 3000ms
    server node6_sse 127.0.0.1:3005 check inter 3000ms
    server node7_sse 127.0.0.1:3006 check inter 3000ms
    server node8_sse 127.0.0.1:3007 check inter 3000ms
